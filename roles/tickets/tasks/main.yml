---
# tickets lives in its own private repo (sebastianastalos/tickets): a local kanban,
# the tk/t commands, Raycast commands, launchd jobs and the conductor skill.
# Cloned with the personal account's token, then its install.sh does the rest.

- name: Clone or update tickets
  ansible.builtin.shell: |
    set -euo pipefail
    helper='!f() { echo username=x-access-token; echo "password=$(gh auth token --user sebastianastalos)"; }; f'
    if [ -d "{{ tickets_dir }}/.git" ]; then
      before=$(git -C "{{ tickets_dir }}" rev-parse HEAD)
      git -C "{{ tickets_dir }}" -c credential.helper= -c credential.helper="$helper" pull -q --ff-only
      [ "$before" = "$(git -C "{{ tickets_dir }}" rev-parse HEAD)" ] && echo unchanged || echo updated
    else
      git -c credential.helper= -c credential.helper="$helper" clone -q https://github.com/sebastianastalos/tickets.git "{{ tickets_dir }}"
      echo cloned
    fi
  args:
    executable: /bin/bash
  register: tickets_repo
  changed_when: tickets_repo.stdout != "unchanged"

- name: Install tickets
  ansible.builtin.command: "{{ tickets_dir }}/install.sh"
  register: tickets_install
  changed_when: "'installed' in tickets_install.stdout or 'added' in tickets_install.stdout or tickets_repo.changed"

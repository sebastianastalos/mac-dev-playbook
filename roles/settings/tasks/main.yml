---
- name: Create cmux config directory
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/cmux"
    state: directory
    mode: "0755"

- name: Deploy cmux config
  ansible.builtin.copy:
    src: cmux.json
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/cmux/cmux.json"
    mode: "0644"

- name: Create Ghostty config directory
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/ghostty"
    state: directory
    mode: "0755"

- name: Configure Ghostty
  ansible.builtin.blockinfile:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/ghostty/config"
    marker: "# {mark} ANSIBLE MANAGED"
    create: true
    mode: "0644"
    block: |
      font-family = JetBrainsMono Nerd Font
      font-size = 14
      background-opacity = 0.92
      background-blur-radius = 20
      window-show-tab-bar = false

- name: Throttle Homebrew auto-update to once a week
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts['env']['HOME'] }}/.zshrc"
    line: "export HOMEBREW_AUTO_UPDATE_SECS=604800"
    create: true
    mode: "0644"

- name: Add cmux branch status hook
  ansible.builtin.blockinfile:
    path: "{{ ansible_facts['env']['HOME'] }}/.zshrc"
    marker: "# {mark} ANSIBLE MANAGED CMUX HOOKS"
    block: |
      _cmux_update_branch() {
        if command -v cmux &>/dev/null && git rev-parse --git-dir &>/dev/null 2>&1; then
          local branch=$(git branch --show-current 2>/dev/null)
          if [[ -n "$branch" ]]; then
            cmux set-status branch "$branch" --icon "arrow.triangle.branch" 2>/dev/null
          else
            cmux clear-status branch 2>/dev/null
          fi
        fi
      }
      precmd_functions+=(_cmux_update_branch)

- name: Add shell aliases
  ansible.builtin.blockinfile:
    path: "{{ ansible_facts['env']['HOME'] }}/.zshrc"
    marker: "# {mark} ANSIBLE MANAGED ALIASES"
    block: |
      # Git
      alias gs='git status'

      # Docker
      alias dps='docker ps -a'
      alias dlogs='docker logs'
      alias dinspect='docker inspect'

      # Claude Code
      alias cld='claude'

      # Terminal
      alias cl='clear'

- name: Mission Control - group windows by application
  community.general.osx_defaults:
    domain: com.apple.dock
    key: expose-group-by-app
    type: bool
    value: true
  notify: Restart Dock

- name: Mission Control - switch to Space with open windows on app activate
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: AppleSpacesSwitchOnActivate
    type: bool
    value: true

- name: Mission Control - displays have separate Spaces
  community.general.osx_defaults:
    domain: com.apple.spaces
    key: spans-displays
    type: bool
    value: false

- name: Mission Control - do not auto-rearrange Spaces by recent use
  community.general.osx_defaults:
    domain: com.apple.dock
    key: mru-spaces
    type: bool
    value: false
  notify: Restart Dock

- name: Set dark mode
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: AppleInterfaceStyle
    type: string
    value: Dark

- name: Show hidden files in Finder
  community.general.osx_defaults:
    domain: com.apple.finder
    key: AppleShowAllFiles
    type: bool
    value: "{{ macos_show_hidden_files }}"
  notify: Restart Finder

- name: Minimize windows into application icon
  community.general.osx_defaults:
    domain: com.apple.dock
    key: minimize-to-application
    type: bool
    value: "{{ macos_minimize_to_application }}"
  notify: Restart Dock

- name: Dock - hide suggested and recent apps
  community.general.osx_defaults:
    domain: com.apple.dock
    key: show-recents
    type: bool
    value: false
  notify: Restart Dock

- name: Set git user name
  community.general.git_config:
    name: user.name
    scope: global
    value: "{{ git_user_name }}"

- name: Set git user email
  community.general.git_config:
    name: user.email
    scope: global
    value: "{{ git_user_email }}"

- name: Set git default branch to main
  community.general.git_config:
    name: init.defaultBranch
    scope: global
    value: main

- name: Set git pull to rebase
  community.general.git_config:
    name: pull.rebase
    scope: global
    value: "true"

- name: Copy global gitignore
  ansible.builtin.copy:
    src: gitignore_global
    dest: "{{ ansible_facts['env']['HOME'] }}/.gitignore"
    mode: "0644"

- name: Set global gitignore in git config
  community.general.git_config:
    name: core.excludesfile
    scope: global
    value: "{{ ansible_facts['env']['HOME'] }}/.gitignore"

- name: Create screenshots folder
  ansible.builtin.file:
    path: "{{ macos_screenshots_folder }}"
    state: directory
    mode: "0755"

- name: Set screenshots save location
  community.general.osx_defaults:
    domain: com.apple.screencapture
    key: location
    type: string
    value: "{{ macos_screenshots_folder }}"

- name: Finder - show all file extensions
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: AppleShowAllExtensions
    type: bool
    value: true
  notify: Restart Finder

- name: Finder - show status bar
  community.general.osx_defaults:
    domain: com.apple.finder
    key: ShowStatusBar
    type: bool
    value: true
  notify: Restart Finder

- name: Finder - use column view by default
  community.general.osx_defaults:
    domain: com.apple.finder
    key: FXPreferredViewStyle
    type: string
    value: clmv
  notify: Restart Finder

- name: Finder - disable extension change warning
  community.general.osx_defaults:
    domain: com.apple.finder
    key: FXEnableExtensionChangeWarning
    type: bool
    value: false
  notify: Restart Finder

- name: Finder - no .DS_Store on network volumes
  community.general.osx_defaults:
    domain: com.apple.desktopservices
    key: DSDontWriteNetworkStores
    type: bool
    value: true

- name: Keyboard - disable press-and-hold in favour of key repeat
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: ApplePressAndHoldEnabled
    type: bool
    value: false

- name: Keyboard - set fast initial key repeat
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: InitialKeyRepeat
    type: int
    value: 20

- name: Keyboard - set fast key repeat rate
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: KeyRepeat
    type: int
    value: 1

# Safari stores its prefs inside its sandbox container. Writes only stick while
# Safari is quit – it overwrites the plist from memory on exit otherwise.
- name: Safari - disable auto-correct spelling
  community.general.osx_defaults:
    domain: com.apple.Safari
    key: WebAutomaticSpellingCorrectionEnabled
    type: bool
    value: "{{ safari_autocorrect }}"

# Stops the iCloud "Hide My Email" row appearing in email fields. Verified on
# macOS 26.6. Trade-off: Safari no longer offers name/address/phone in forms.
- name: Safari - disable contacts autofill
  community.general.osx_defaults:
    domain: com.apple.Safari
    key: AutoFillFromAddressBook
    type: bool
    value: "{{ safari_autofill_from_contacts }}"

# Despite the Safari domain, this backs the system-wide AutoFill switch in
# System Settings > General > AutoFill & Passwords. Must be on for providers
# in the "AutoFill from" list (1Password) to fill; the per-provider rows
# aren't scriptable.
- name: Enable system-wide AutoFill
  community.general.osx_defaults:
    domain: com.apple.Safari
    key: AutoFillPasswords
    type: bool
    value: "{{ macos_autofill_passwords }}"

# LSSetDefaultRoleHandlerForContentType refuses public.folder (-50), so Bloom's
# documented route is used instead: NSFileViewer plus a direct LSHandlers entry.
# Needs a restart to take effect. https://bloomapp.club/user-guide
- name: Set Bloom as the default file viewer
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: NSFileViewer
    type: string
    value: "{{ bloom_bundle_id }}"

- name: Read current LaunchServices handlers
  ansible.builtin.command:
    argv:
      - plutil
      - -p
      - "{{ ansible_facts['env']['HOME'] }}/Library/Preferences/\
        com.apple.LaunchServices/com.apple.launchservices.secure.plist"
  register: settings_lshandlers
  changed_when: false
  failed_when: false

- name: Register Bloom as the folder handler
  ansible.builtin.shell:
    cmd: |
      defaults write com.apple.LaunchServices/com.apple.launchservices.secure \
        LSHandlers -array-add \
        '{LSHandlerContentType="public.folder";
      LSHandlerRoleAll="{{ bloom_bundle_id }}";}'
  when: bloom_bundle_id not in (settings_lshandlers.stdout | default(''))
  changed_when: true

- name: Add apps to login items
  ansible.builtin.command:
    argv:
      - osascript
      - -e
      - 'tell application "System Events"'
      - -e
      - 'if not (exists login item "{{ item.name }}") then'
      - -e
      - 'make login item at end with properties {path:"{{ item.path }}", hidden:false}'
      - -e
      - 'end if'
      - -e
      - 'end tell'
  loop: "{{ login_items }}"
  loop_control:
    label: "{{ item.name }}"
  register: settings_login_item_result
  changed_when: false
  failed_when: settings_login_item_result.rc != 0 and 'not allowed to send Apple events' not in (settings_login_item_result.stderr | default(''))

- name: Create .ssh directory
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.ssh"
    state: directory
    mode: "0700"

- name: Generate SSH keypair if absent
  community.crypto.openssh_keypair:
    path: "{{ ansible_facts['env']['HOME'] }}/.ssh/id_ed25519"
    type: ed25519
    comment: "{{ git_user_email }}"
    state: present

# Serves keys from the 1Password vault, so ssh needs no key on disk.
# Host * goes last so any host-specific blocks above still win.
- name: Point ssh at the 1Password SSH agent
  ansible.builtin.blockinfile:
    path: "{{ ansible_facts['env']['HOME'] }}/.ssh/config"
    marker: "# {mark} ANSIBLE MANAGED 1PASSWORD AGENT"
    create: true
    mode: "0600"
    block: |
      Host *
        IdentityAgent "~/{{ op_agent_sock }}"

# ssh itself uses IdentityAgent above. This covers tools that speak the agent
# protocol directly without reading ssh_config, such as ssh-add.
- name: Export SSH_AUTH_SOCK for the 1Password agent
  ansible.builtin.blockinfile:
    path: "{{ ansible_facts['env']['HOME'] }}/.zshrc"
    marker: "# {mark} ANSIBLE MANAGED SSH AGENT"
    create: true
    mode: "0644"
    block: |
      export SSH_AUTH_SOCK="$HOME/{{ op_agent_sock }}"

---
# Homebrew taps (needed before cask installs)
homebrew_taps:
  - manaflow-ai/cmux
  - hashicorp/tap

# Homebrew casks (GUI apps)
homebrew_casks:
  - obsidian
  - 1password
  - claude
  - visual-studio-code
  - cmux
  - docker
  - tailscale
  - font-jetbrains-mono-nerd-font
  - alfred

  - finetune
  - mos
  - stats
  - 1password-cli
  - shottr
  - discord

  - firefox
  - spotify
  - chatgpt

# Mac App Store apps. Safari extensions are App Store-only – the 1password cask
# does not bundle "1Password for Safari". Both still need enabling by hand in
# Safari > Settings > Extensions; see README.
mas_apps:
  - id: 937984704
    name: "Amphetamine"
  - id: 1569813296
    name: "1Password for Safari"
  - id: 1662217862
    name: "Wipr"

# Homebrew formulae (CLI tools)
homebrew_formulae:
  - node
  - gh
  - dockutil
  - hashicorp/tap/terraform
  - hashicorp/tap/packer
  - ansible-lint
  - yamllint

# VS Code extensions
vscode_extensions:
  - 4ops.terraform
  - anthropic.claude-code
  - bierner.markdown-yaml-preamble
  - emmanuelbeziat.vscode-great-icons
  - github.github-vscode-theme
  - github.vscode-pull-request-github
  - mhutchie.git-graph
  - miguelsolorio.fluent-icons
  - ms-vscode-remote.remote-containers
  - ms-vscode-remote.remote-ssh
  - ms-vscode-remote.remote-ssh-edit
  - ms-vscode.remote-explorer
  - narasimapandiyan.jetbrainsmono
  - nerudevs.jellyfish-dark
  - openai.chatgpt
  - pkief.material-icon-theme
  - pranjalkumar.minimal-kiwi
  - redhat.vscode-yaml
  - usernamehw.errorlens
  - vscode-icons-team.vscode-icons
  - wayou.vscode-todo-highlight

# npm global packages
npm_global_packages:
  - "@anthropic-ai/claude-code"

# Agent skills, installed globally by the `skills` CLI into ~/.agents/skills
# and symlinked into ~/.claude/skills. `provides` is a sentinel list used to
# skip the install when those skills are already in ~/.agents/.skill-lock.json.
agent_skill_packages:
  - package: manaflow-ai/cmux
    provides:
      - cmux
      - cmux-browser
      - cmux-workspace
  - package: manaflow-ai/cmux-skills
    provides:
      - cmux-cli
      - cmux-config
      - cmux-ref

# Run `skills update` on every playbook run to pull newer skill versions
agent_skills_update: false

# 1Password SSH agent socket, relative to $HOME (2BUA8C4S2C is 1Password's
# team ID). Enabling the agent itself is a manual step – see README.
op_agent_sock: "Library/Group Containers/2BUA8C4S2C.com.1password/t/agent.sock"

# Git identity
git_user_name: "sebastianastalos"
git_user_email: "96073170+sebastianastalos@users.noreply.github.com"

# macOS settings
macos_show_hidden_files: true
macos_minimize_to_application: true
macos_screenshots_folder: "{{ ansible_facts['env']['HOME'] }}/Screenshots"

# Safari settings
safari_autocorrect: false
# Off also hides the iCloud "Hide My Email" suggestion in email fields
safari_autofill_from_contacts: false

# Apple Passwords autofill, system-wide (settings role notes the domain quirk).
# Off so it doesn't crowd out 1Password, prompt to save, or offer Hide My Email.
macos_autofill_passwords: false

# Apps to open at login
login_items:
  - name: Alfred 5
    path: /Applications/Alfred 5.app
  - name: Amphetamine
    path: /Applications/Amphetamine.app
  - name: Stats
    path: /Applications/Stats.app

  - name: FineTune
    path: /Applications/FineTune.app
  - name: Mos
    path: /Applications/Mos.app

# Dock items (pinned apps in order)
dock_items:
  - name: Calendar
    path: /System/Applications/Calendar.app
  - name: System Settings
    path: /System/Applications/System Settings.app
  - name: Messages
    path: /System/Applications/Messages.app
  - name: App Store
    path: /System/Applications/App Store.app
  - name: Docker
    path: /Applications/Docker.app
  - name: Discord
    path: /Applications/Discord.app
  - name: Safari
    path: /System/Applications/Safari.app
  - name: Visual Studio Code
    path: /Applications/Visual Studio Code.app

  - name: Firefox
    path: /Applications/Firefox.app
  - name: cmux
    path: /Applications/cmux.app
  - name: 1Password
    path: /Applications/1Password.app
  - name: Obsidian
    path: /Applications/Obsidian.app
  - name: Launchpad
    path: /System/Applications/Launchpad.app
  - name: Spotify
    path: /Applications/Spotify.app
  - name: Claude
    path: /Applications/Claude.app
  - name: ChatGPT
    path: /Applications/ChatGPT.app
